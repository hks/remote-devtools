# Remote DevTools desktop packages — unsigned distribution (signed/notarized release: docs/maintainers/macos-release.md, Phase 6).
appId: com.himmetkaan.remote-devtools
productName: Remote DevTools
artifactName: RemoteDevTools-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build   # build/icon.png → icon for all platforms
files:
  - dist/**
  - package.json
# The built UI lives outside the asar; the relay serves it as plain files.
extraResources:
  - from: ../../packages/ui/dist
    to: ui
    filter: ["**/*", "!**/*.map"]
asar: true
afterPack: scripts/after-pack.mjs

mac:
  target:
    # Apple Silicon only.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # Certificate signing is off: otherwise any Apple certificate in the keychain would be picked automatically.
  # scripts/after-pack.mjs applies the ad-hoc signature Apple Silicon requires.
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSLocalNetworkUsageDescription: Remote DevTools connects to apps on devices in your local network.

# Windows and Linux are not part of the release for now (the npm scripts only call --mac).
# To re-enable: npx electron-builder --win / --linux
win:
  # Single .exe, no installer.
  target:
    - target: portable
      arch: [x64]
  # rcedit needs Wine on macOS/Linux; exe metadata is not needed for unsigned distribution.
  signAndEditExecutable: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
