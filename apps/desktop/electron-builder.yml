# Remote DevTools desktop packages. Signing and notarization: docs/maintainers/macos-release.md.
# With a Developer ID certificate (keychain or CSC_LINK) the app is signed; with APPLE_API_KEY / APPLE_API_KEY_ID /
# APPLE_API_ISSUER it is also notarized. Without them the build stays ad-hoc signed (local, unsigned packages).
appId: com.himmetkaan.remote-devtools
productName: Remote DevTools
artifactName: RemoteDevTools-${version}-${os}-${arch}.${ext}
directories:
  output: release
  buildResources: build   # build/icon.png → icon for all platforms
files:
  - dist/**
  - package.json
# The built UI lives outside the asar; the relay serves it as plain files.
extraResources:
  - from: ../../packages/ui/dist
    to: ui
    filter: ["**/*", "!**/*.map"]
asar: true
afterPack: scripts/after-pack.mjs

mac:
  target:
    # Apple Silicon only.
    - target: dmg
      arch: [arm64]
    - target: zip
      arch: [arm64]
  category: public.app-category.developer-tools
  # `pnpm dist` passes identity=null (ad-hoc signature from scripts/after-pack.mjs, which Apple Silicon requires);
  # `dist:signed` / `release` require CSC_NAME or CSC_LINK so no other certificate in the keychain gets picked.
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    NSLocalNetworkUsageDescription: Remote DevTools connects to apps on devices in your local network.
    NSBonjourServices:
      - _remotedevtools._tcp

# Releases (and the auto-update feed, latest-mac.yml) live on GitHub Releases of the public repository, tagged
# desktop-vX.Y.Z. electron-updater reads the repository's *latest* release, so no other workflow creates releases.
# The release workflow creates the draft first (parallel uploads would otherwise each create a release) and publishes it
# once the signature checks pass.
publish:
  provider: github
  owner: hks
  repo: remote-devtools
  releaseType: draft
  tagNamePrefix: desktop-v

# Windows and Linux are not part of the release for now (the npm scripts only call --mac).
# To re-enable: npx electron-builder --win / --linux
win:
  # Single .exe, no installer.
  target:
    - target: portable
      arch: [x64]
  # rcedit needs Wine on macOS/Linux; exe metadata is not needed for unsigned distribution.
  signAndEditExecutable: false

linux:
  target:
    - target: AppImage
      arch: [x64]
  category: Development
