name: remote-devtools

services:
  relay:
    build:
      context: ../..
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8080
      PUBLIC_URL: ${PUBLIC_URL:-}
      # The relay sits behind Caddy: the client address is read from X-Forwarded-For.
      TRUST_PROXY: "true"
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      PAIR_TOKEN_TTL_SEC: ${PAIR_TOKEN_TTL_SEC:-120}
      DEVICE_IDLE_TTL_MIN: ${DEVICE_IDLE_TTL_MIN:-60}
      CONNECT_REQUESTS: ${CONNECT_REQUESTS:-off}
      CONNECT_REQUEST_TTL_SEC: ${CONNECT_REQUEST_TTL_SEC:-120}
      HEARTBEAT_INTERVAL_SEC: ${HEARTBEAT_INTERVAL_SEC:-15}
      MAX_PAYLOAD_MB: ${MAX_PAYLOAD_MB:-5}
      MAX_SESSIONS: ${MAX_SESSIONS:-1000}
      MAX_DEVICES_PER_SESSION: ${MAX_DEVICES_PER_SESSION:-20}
      DEVICE_MAX_MSGS_PER_SEC: ${DEVICE_MAX_MSGS_PER_SEC:-200}
      PAIR_FAILURE_LIMIT: ${PAIR_FAILURE_LIMIT:-10}
      PAIR_FAILURE_WINDOW_SEC: ${PAIR_FAILURE_WINDOW_SEC:-600}
    expose:
      - "8080"

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    depends_on:
      relay:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
    ports:
      - "${HTTP_PORT:-8080}:80"
      - "${HTTPS_PORT:-8443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
