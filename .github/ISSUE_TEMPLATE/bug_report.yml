name: Bug report
description: Something does not work as expected
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Start the relay with …
        2. Pair a device with …
        3. Open the … tab
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Component
      multiple: true
      options:
        - JS SDK
        - Relay
        - Web UI
        - Desktop app
        - Docker image
        - Documentation
    validations:
      required: true
  - type: input
    id: versions
    attributes:
      label: Versions
      placeholder: "SDK 0.1.0, desktop app 0.1.0, React Native 0.80 / Expo 54, iOS 26"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: SDK output with `debug: true`, relay logs, or browser console errors.
      render: text
